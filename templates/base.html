<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --card-hover: #334155;
        --accent: #38bdf8;
        --accent-hover: #0284c7;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        line-height: 1.6;
        padding-bottom: 3rem;
      }

      header {
        max-width: 900px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      @media (min-width: 640px) {
        header {
          flex-direction: row;
          justify-content: space-between;
          align-items: center;
        }
      }

      header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      header h1 a {
        color: var(--text-main);
        text-decoration: none;
      }

      .search-form {
        display: flex;
        gap: 0.5rem;
      }

      .search-input {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 0.6rem 1rem;
        border-radius: var(--radius);
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
        width: 100%;
      }

      .search-input:focus {
        border-color: var(--accent);
      }

      .search-btn {
        background-color: var(--accent);
        color: #0f172a;
        font-weight: 600;
        border: none;
        padding: 0.6rem 1.25rem;
        border-radius: var(--radius);
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .search-btn:hover {
        background-color: var(--accent-hover);
        color: #fff;
      }

      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 1.5rem;
      }

      .articles {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .article-card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 1.25rem 1.5rem;
        transition: transform 0.2s, border-color 0.2s;
      }

      .article-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
      }

      .article-title {
        font-size: 1.15rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        line-height: 1.4;
      }

      .article-title a {
        color: var(--text-main);
        text-decoration: none;
      }

      .article-title a:hover {
        color: var(--accent);
      }

      .article-meta {
        display: flex;
        gap: 1rem;
        font-size: 0.85rem;
        color: var(--text-muted);
        align-items: center;
      }

      .source-badge {
        background-color: rgba(56, 189, 248, 0.1);
        color: var(--accent);
        padding: 0.2rem 0.6rem;
        border-radius: 6px;
        font-weight: 500;
      }

      .pagination {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 2.5rem;
      }

      .pagination a {
        background-color: var(--card-bg);
        color: var(--text-main);
        text-decoration: none;
        padding: 0.6rem 1.2rem;
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
        font-weight: 500;
        transition: all 0.2s;
      }

      .pagination a:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="{{ url_for('index') }}">News Hub</a></h1>
      <form class="search-form" action="{{ url_for('search') }}" method="GET">
        <input class="search-input" type="text" name="q" value="{{ query if query is defined else '' }}" placeholder="Search articles..." />
        <button class="search-btn" type="submit">Search</button>
      </form>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
